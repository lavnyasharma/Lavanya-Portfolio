<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2b30"/>
      <stop offset="100%" stop-color="#07161a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- container ship silhouette -->
  <g transform="translate(560,190)" fill="#0e3a41" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7">
    <rect x="0" y="60" width="240" height="18" rx="3"/>
    <rect x="15" y="20" width="30" height="42"/>
    <rect x="55" y="20" width="30" height="42"/>
    <rect x="95" y="10" width="30" height="52"/>
    <rect x="135" y="20" width="30" height="42"/>
    <rect x="175" y="20" width="30" height="42"/>
    <path d="M0 78 L20 100 H220 L240 78 Z" fill="#0e3a41"/>
  </g>

  <!-- chat bubble w/ spark (AI) -->
  <g transform="translate(870,140)">
    <rect x="0" y="0" width="150" height="100" rx="20" fill="#0e3a41" stroke="#22d3ee" stroke-width="2"/>
    <path d="M20 100 L20 130 L55 100 Z" fill="#0e3a41" stroke="#22d3ee" stroke-width="2"/>
    <path d="M75 25 L83 45 L103 53 L83 61 L75 81 L67 61 L47 53 L67 45 Z" fill="#22d3ee"/>
  </g>

  <text x="800" y="470" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">PortGPT</text>
  <text x="800" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#7fe3f0" letter-spacing="0.5">AI-Powered Port Operations Platform</text>

  <text x="800" y="590" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#5fa8b0">Next.js 16 · React 19 · SSE Streaming · Web / iOS / Android via Capacitor</text>

  <rect x="700" y="640" width="200" height="3" fill="#22d3ee"/>
