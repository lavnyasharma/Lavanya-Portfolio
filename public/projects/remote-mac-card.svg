<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#120c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>

  <!-- laptop -->
  <g transform="translate(660,170)">
    <rect x="0" y="0" width="280" height="170" rx="10" fill="#1e1530" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="14" y="14" width="252" height="142" rx="4" fill="#120c1c"/>
    <rect x="-20" y="170" width="320" height="16" rx="6" fill="#1e1530" stroke="#a78bfa" stroke-width="2"/>

    <!-- signal / remote waves -->
    <g stroke="#a78bfa" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M140 45 q0 20 -20 30" opacity="0.9"/>
      <path d="M140 30 q0 40 -40 55" opacity="0.6"/>
      <path d="M140 15 q0 60 -60 80" opacity="0.35"/>
    </g>
    <circle cx="140" cy="85" r="8" fill="#a78bfa"/>
  </g>

  <!-- cursor / control glyph -->
  <g transform="translate(1000,290)">
    <path d="M0 0 L45 20 L26 26 L20 45 Z" fill="#a78bfa"/>
  </g>

  <text x="800" y="470" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="0.5">Remote Mac Control</text>
  <text x="800" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#c7b6f7" letter-spacing="0.5">Personal Tool for Remote Access &amp; Automation</text>

  <text x="800" y="590" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#8f7ab0">Screen Control · Secure Session Handling · Cross-Device Workflow</text>

  <rect x="700" y="640" width="200" height="3" fill="#a78bfa"/>
</svg>
